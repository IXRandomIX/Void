<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <div id="starfield"></div>

    <!-- Header -->
    <div id="header">
      <div id="logo">
        <div class="logo-dot"></div>
        VOID
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="icon-btn" id="clear-btn" title="Clear history">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
        <button class="icon-btn" id="pip-btn" title="Private view — hides chat from screen share">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <rect x="12" y="10" width="8" height="5" rx="1" fill="currentColor" stroke="none"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Context bar -->
    <div id="context-bar">
      <div class="context-pill">
        <div class="context-dot"></div>
        <span class="context-url" id="context-url-text">loading...</span>
      </div>
    </div>

    <!-- Chat area -->
    <div id="chat-area">
      <div class="empty-state" id="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span class="empty-text">Awaiting input in the void...</span>
      </div>
    </div>

    <!-- Suggestions -->
    <div id="suggestions"></div>

    <!-- Input -->
    <div id="input-area">
      <div id="file-previews"></div>
      <div class="input-wrapper">
        <button class="icon-btn" id="attach-btn" title="Attach file">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="file-input" multiple accept="*/*" style="display:none" />
        <textarea
          id="message-input"
          placeholder="Message Void..."
          rows="1"
        ></textarea>
        <button id="send-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="shortcut-hint">Alt+Ctrl+Shift+G to toggle</div>
    </div>

    <!-- Drop overlay -->
    <div id="drop-overlay">
      <div class="drop-inner">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <span>Drop files into Void</span>
      </div>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel">
      <div class="settings-title">VOID CONFIGURATION</div>
      <div>
        <div class="settings-label">API Base URL</div>
        <input class="settings-input" id="api-url-input" type="text" placeholder="https://your-deployed-domain.replit.app" />
        <div class="settings-hint">The URL of your deployed Void backend. Deploy on Replit and paste the URL here.</div>
      </div>
      <button class="settings-save-btn" id="save-settings-btn">Save</button>
      <span class="settings-close" id="close-settings-btn">Close settings</span>
    </div>
  </div>

  <script src="chrome-shim.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
